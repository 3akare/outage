# Deploys workers/api to Cloudflare (ADR 0021, guide: docs/deploy.md).
# Skips with a notice, not a failure, until the Cloudflare secrets exist.
# Wrangler in CI (token and account ID): https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
# Wrangler secret commands: https://developers.cloudflare.com/workers/wrangler/commands/workers/#secret
# Durable Object migrations (SQLite classes, free plan): https://developers.cloudflare.com/durable-objects/reference/durable-objects-migrations/
# workers.dev subdomain and its Browser Integrity Check: https://developers.cloudflare.com/workers/configuration/routing/workers-dev/
name: deploy-worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - 'packages/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

# One deploy at a time. A newer run waits instead of cancelling a deploy half way.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that deploying is set up
        id: gate
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice title=Deploy skipped::Only main is deployed. This run is on $GITHUB_REF."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set. Follow docs/deploy.md, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      # The same checks as checks.yml (node job). Nothing deploys if one fails.
      - if: steps.gate.outputs.ready == 'true'
        run: npm run lint
      - if: steps.gate.outputs.ready == 'true'
        run: npm run typecheck
      - if: steps.gate.outputs.ready == 'true'
        run: npm test
      - if: steps.gate.outputs.ready == 'true'
        run: node .kiro/scripts/spec-lint.mjs

      - name: Deploy the Worker
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        working-directory: workers/api
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error title=No workers.dev URL::Wrangler did not print a workers.dev URL. Turn on the workers.dev subdomain (docs/deploy.md, step 3)."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      # INSTALL_TOKEN_SECRET signs every install token. Rotating it logs out every install,
      # so it is created once and never overwritten. The value is piped, never printed.
      - name: Create INSTALL_TOKEN_SECRET if missing
        if: steps.gate.outputs.ready == 'true'
        working-directory: workers/api
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > "$RUNNER_TEMP/secrets.json"
          if node -e 'const l=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(l.some((s)=>s.name==="INSTALL_TOKEN_SECRET")?0:1)' "$RUNNER_TEMP/secrets.json"; then
            echo "INSTALL_TOKEN_SECRET already exists. Left unchanged."
          else
            openssl rand -hex 32 | npx wrangler secret put INSTALL_TOKEN_SECRET > /dev/null
            echo "INSTALL_TOKEN_SECRET created."
          fi

      - name: Push FIELD_READ_TOKEN if the GitHub secret exists
        if: steps.gate.outputs.ready == 'true'
        working-directory: workers/api
        env:
          FIELD_READ_TOKEN: ${{ secrets.FIELD_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FIELD_READ_TOKEN" ]; then
            echo "::notice title=FIELD_READ_TOKEN not set::The GitHub secret FIELD_READ_TOKEN is empty, so the Worker has none. /v1/admin/field answers 500 until you add it. The field-report reader needs the same value."
          else
            printf '%s' "$FIELD_READ_TOKEN" | npx wrangler secret put FIELD_READ_TOKEN > /dev/null
            echo "FIELD_READ_TOKEN pushed."
          fi

      # The Firebase service-account JSON for push (alerts-and-light-alarm R11.3). Piped, never printed. Without it the Worker
      # still runs; follow works and queued pushes are dropped as NOT_CONFIGURED until the secret exists.
      - name: Push FCM_SERVICE_ACCOUNT if the GitHub secret exists
        if: steps.gate.outputs.ready == 'true'
        working-directory: workers/api
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::notice title=FCM_SERVICE_ACCOUNT not set::The GitHub secret FCM_SERVICE_ACCOUNT is empty, so the Worker cannot send pushes. Follow docs/deploy.md."
          else
            printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT > /dev/null
            echo "FCM_SERVICE_ACCOUNT pushed."
          fi

      # workers.dev checks the browser integrity, so curl sends a descriptive User-Agent.
      - name: Smoke check
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "Checking $URL"
          for path in / /api/v1/public/judge/replay; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -A 'outage-deploy-check/1.0 (github actions)' "$URL$path" || echo 000)
              echo "GET $path attempt $attempt: HTTP $code"
              case "$code" in 2??) ok=1; break ;; esac
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "::error title=Smoke check failed::GET $path did not answer 2xx."
              exit 1
            fi
          done
          echo "Smoke check passed: $URL"

      # web-and-area-pages task 5: cache headers and the CSP nonce, on the deployed domain (R9, W4).
      - name: Post-deploy header check
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/post-deploy-check.sh
