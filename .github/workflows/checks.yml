# Repo checks that need no Android SDK: Biome, hook and skill tests, spec lint, probe Worker and analysis.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Detection property suite (2000 runs)
        run: FC_NUM_RUNS=2000 npx vitest --run --dir packages/detection
      - run: node .kiro/scripts/spec-lint.mjs
      - run: npm run probe:install
      - run: npm run probe:typecheck
      - run: npm run probe:test

  visual:
    # 390 x 844 visual check of the public pages (ADR 0019). Screenshots are uploaded as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash workers/api/visual/run.sh
        env:
          SHOTS: ${{ runner.temp }}/visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual
          path: ${{ runner.temp }}/visual
