# Builds the Android projects with the free GitHub-hosted runner (ADR 0012).
# Debug-signed probe APK for the feasibility test; real signed releases are added with the app.
name: android

on:
  push:
    branches: [main]
    tags: ['probe-v*']
    paths: ['android/probe/**', 'android/outage/**', 'core/shared/src/oem-guide.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/probe/**', 'android/outage/**', 'core/shared/src/oem-guide.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/probe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile, unit test, lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/outage-probe-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: outage-probe-debug
          path: ${{ runner.temp }}/outage-probe-debug.apk
          if-no-files-found: error
      - name: Publish to a GitHub Release (tags probe-v* only)
        if: startsWith(github.ref, 'refs/tags/probe-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/outage-probe-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Outage probe $GITHUB_REF_NAME" \
            --notes "Debug-signed probe build for the Milestone 1 feasibility test. Not the product." --prerelease
    # The release step needs contents: write
    permissions:
      contents: write

  # The real app (app-shell spec). Same steps as the probe, no release step yet.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/outage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # Push config (ADR 0036). Optional: without the secret the build still works and push stays off. See docs/deploy.md.
      - name: Write the Firebase config from the secret
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_B64" ]; then
            printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d > app/google-services.json
          fi
      - name: Compile, unit test, lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/outage-app-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: outage-app-debug
          path: ${{ runner.temp }}/outage-app-debug.apk
          if-no-files-found: error
